name: ChirpStack LoRaWAN
version: "4.20.0-fb1"
slug: chirpstack_fb
description: >-
  ChirpStack LoRaWAN network server and gateway bridge for Farm Base
  (US915, sub-band 2). Uses the Mosquitto broker add-on.
url: https://github.com/nickduvall921/farmbase-ha-addons/tree/main/chirpstack_fb
arch:
  - amd64
  - aarch64
startup: services
boot: auto
# The Home Assistant base image runs s6-overlay as PID 1.
init: false
stage: experimental
# SQLite lives in /data; stop the add-on during a backup so the copy is consistent.
backup: cold
services:
  - mqtt:need
ports:
  1700/udp: 1700
  8080/tcp: 8080
ports_description:
  1700/udp: LoRa gateways (Semtech UDP packet forwarder)
  8080/tcp: ChirpStack web interface and API
webui: http://[HOST]:[PORT:8080]
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|warn|error)
