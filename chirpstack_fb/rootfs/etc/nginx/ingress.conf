# Home Assistant ingress for the ChirpStack web interface.
#
# ChirpStack's page loads its files and calls its API from the site root
# (/assets/..., /api.InternalService/...). Behind ingress the page lives
# under /api/hassio_ingress/<token>/, so those paths are rewritten here
# with the X-Ingress-Path header Home Assistant sends.
#
# The login token is sent as X-CS-Authorization through ingress, so the
# proxy in front never sees an Authorization header it might drop or use,
# and is turned back into Authorization for ChirpStack.

worker_processes 1;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path /run/nginx/body;
    proxy_temp_path /run/nginx/proxy;
    fastcgi_temp_path /run/nginx/fastcgi;
    uwsgi_temp_path /run/nginx/uwsgi;
    scgi_temp_path /run/nginx/scgi;

    server {
        listen 8099;
        allow 172.30.32.2;
        allow 127.0.0.1;
        deny all;

        client_max_body_size 16m;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_x_cs_authorization;
            proxy_set_header X-CS-Authorization "";
            # sub_filter can only rewrite uncompressed bodies.
            proxy_set_header Accept-Encoding "";
            # Live frames and events are long-running streams.
            proxy_buffering off;
            proxy_read_timeout 1h;

            sub_filter_types application/javascript text/javascript;
            sub_filter_once off;
            sub_filter 'src="/' 'src="$http_x_ingress_path/';
            sub_filter 'href="/' 'href="$http_x_ingress_path/';
            sub_filter 'this.hostname_+`/api.' 'this.hostname_+`$http_x_ingress_path/api.';
            sub_filter '`/logo.png`' '`$http_x_ingress_path/logo.png`';
            sub_filter '{authorization:`Bearer `' '{"x-cs-authorization":`Bearer `';
        }
    }
}
